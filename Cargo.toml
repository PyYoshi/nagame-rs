[package]
name = "nagame"
default-run = "nagame"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast single-window image viewer built with Rust and GPUI"
license = "GPL-3.0-or-later"

[features]
ui-smoke = []

[dependencies]
gpui = "=0.2.2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp", "tiff", "ico"] }
libheif-rs = { version = "3.0", default-features = false, features = ["v1_17"] }
i18n-embed = { version = "0.16", default-features = false, features = ["fluent-system", "rust-embed", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Memory pressure (PSI poll) and glibc allocator tuning in src/memory.rs.
libc = "0.2"

[profile.dev]
debug = 0
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[patch.crates-io]
# GPUI -> gpui_http_client -> zed-async-tar -> xattr 0.2.3 uses a removed libc alias on Linux.
xattr = { path = "vendor/xattr" }


[[bin]]
name = "decode-bench"
path = "src/bin/decode-bench.rs"
test = false

[dev-dependencies]
fluent-bundle = "0.16"
fluent-syntax = "0.12"
