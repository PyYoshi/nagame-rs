# 組み込みの検出規則はそのまま使い、生成物とローカルのツールの状態だけを除く。
# このファイルは --config で明示して渡す（Betterleaks v1.10.0）。
title = "Nagame secret scanning"
prefilter = '''
filter.matchesAny(attributes["path"], [
  `(?:^|[\\/])(?:target|\.omc|\.git|__pycache__)(?:[\\/]|$)`,
  `(?:^|[\\/])\.idea[\\/]workspace\.xml$`
])
'''

[extend]
useDefault = true
